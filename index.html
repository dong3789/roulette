<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0A09" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="룰렛">
<meta name="description" content="폴더별 룰렛 · 당첨 기록 · 통계">
<title>룰렛</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%234F46E5'/%3E%3Cpath d='M16 16 L16 2 A14 14 0 0 1 28.1 9z' fill='%23E8B85C'/%3E%3Cpath d='M16 16 L28.1 23 A14 14 0 0 1 16 30z' fill='%230F8B8D'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,"Noto Sans KR","Malgun Gothic",sans-serif;
  --bg:#FAFAF9;--bg-glass:rgba(250,250,249,.82);--surface:#FFFFFF;--surface-2:#F5F5F4;--surface-3:#EFEEEC;
  --border:#E7E5E4;--border-strong:#D6D3D1;--text:#1C1917;--text-2:#78716C;--text-3:#A8A29E;
  --accent:#4F46E5;--accent-hover:#4338CA;--accent-fg:#FFFFFF;--accent-soft:#EEF2FF;--accent-text:#4338CA;
  --danger:#DC2626;--danger-soft:#FEF2F2;--track:#F0EFED;
  --shadow-sm:0 1px 2px rgba(28,25,23,.05);
  --shadow-md:0 1px 2px rgba(28,25,23,.04),0 8px 24px -8px rgba(28,25,23,.12);
  --shadow-lg:0 2px 4px rgba(28,25,23,.04),0 24px 64px -16px rgba(28,25,23,.28);
  --ring:0 0 0 3px rgba(79,70,229,.22);
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:22px;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.4,.64,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C0A09;--bg-glass:rgba(12,10,9,.78);--surface:#1C1917;--surface-2:#231F1D;--surface-3:#2C2725;
  --border:#292524;--border-strong:#3A3532;--text:#FAFAF9;--text-2:#A8A29E;--text-3:#78716C;
  --accent:#818CF8;--accent-hover:#A5B4FC;--accent-fg:#14123A;--accent-soft:#272536;--accent-text:#A5B4FC;
  --danger:#F87171;--danger-soft:#2A1717;--track:#2A2523;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 1px 2px rgba(0,0,0,.3),0 8px 24px -8px rgba(0,0,0,.5);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 24px 64px -16px rgba(0,0,0,.7);
  --ring:0 0 0 3px rgba(129,140,248,.3);
}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-weight:500;box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,transform .1s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{background:var(--accent);border-color:transparent;color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-hover);border-color:transparent}
.btn-danger{background:var(--danger);border-color:transparent;color:#fff}
.btn-danger:hover{background:var(--danger);filter:brightness(1.08);border-color:transparent}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);border-color:transparent}
.btn-sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn-lg{height:44px;padding:0 18px;font-size:15px;border-radius:12px}
.icon-btn{width:36px;height:36px;padding:0;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--text-2);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.icon-btn svg,.btn svg{width:18px;height:18px;flex:none}

/* ---------- layout ---------- */
.app{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr)}
.sidebar{display:none}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px 16px;background:var(--bg-glass);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.02em}
.brand-mark{width:22px;height:22px;flex:none}
.chip{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:36px;max-width:60vw;padding:0 10px 0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-sm);font-weight:600;font-size:14px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip svg{width:16px;height:16px;color:var(--text-2);flex:none}
.main{display:flex;flex-direction:column;gap:16px;padding:16px 16px calc(env(safe-area-inset-bottom) + 28px);min-width:0}

/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;align-items:center;min-width:0}
.stage-head{width:100%;display:flex;align-items:center;gap:8px;margin-bottom:18px}
.stage-title{flex:1;min-width:0}
.stage-title h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-title p{margin:2px 0 0;font-size:13px;color:var(--text-2)}
.stage-actions{display:flex;gap:2px}
.wheel-box{position:relative;width:min(100%,400px);aspect-ratio:1/1;margin-top:10px}
.wheel-ring{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:var(--surface);border:1px solid var(--border);padding:7px;box-shadow:var(--shadow-md);transition:box-shadow .6s var(--ease)}
.wheel-box.glow .wheel-ring{box-shadow:var(--shadow-md),0 0 0 6px color-mix(in srgb,var(--glow) 22%,transparent),0 0 60px -6px var(--glow)}
.wheel-ring canvas{display:block;width:100%;height:100%;border-radius:50%;will-change:transform;transform:rotate(0rad)}
.pointer{position:absolute;left:50%;top:-16px;width:30px;height:40px;margin-left:-15px;z-index:3;color:var(--text);transform-origin:50% 35%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.pointer svg{width:100%;height:100%;display:block}
.hub{position:absolute;left:50%;top:50%;width:74px;height:74px;margin:-37px 0 0 -37px;z-index:2;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--accent-text);font-size:15px;font-weight:700;letter-spacing:-.02em;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px -4px rgba(0,0,0,.25);transition:transform .15s var(--ease),color .15s,box-shadow .2s}
.hub:hover{transform:scale(1.04)}
.hub:active{transform:scale(.95)}
.hub:disabled{color:var(--text-3);cursor:default;transform:none}
.hub::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1px solid var(--border)}
.stage-foot{width:min(100%,400px);margin-top:22px;display:flex;flex-direction:column;gap:10px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface)}
.toggle-row label{font-size:14px;font-weight:500;cursor:pointer}
.toggle-row small{display:block;color:var(--text-2);font-size:12px;font-weight:400}
.switch{position:relative;width:42px;height:26px;flex:none;-webkit-appearance:none;appearance:none;margin:0;border-radius:999px;background:var(--border-strong);cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--spring)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(16px)}
.last{min-height:20px;text-align:center;font-size:13px;color:var(--text-2)}
.last b{color:var(--text);font-weight:600}
.hint{color:var(--text-2);font-size:13px;text-align:center}

/* ---------- panel ---------- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;min-width:0}
.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin:12px 12px 0;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border)}
.tab{position:relative;z-index:1;height:32px;border:0;background:transparent;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-2);transition:color .2s}
.tab[aria-selected="true"]{color:var(--text);font-weight:600}
.tab .badge{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:999px;background:var(--surface-3);font-size:11px;line-height:17px;color:var(--text-2)}
.tab-ind{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:8px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--border);transition:transform .3s var(--ease)}
.tabpanel{padding:16px;min-height:280px}
.tabpanel[hidden]{display:none}
.field-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.field-head label{font-size:13px;font-weight:600}
.count{font-size:12px;color:var(--text-2)}
.count.warn{color:var(--danger)}
textarea.items{display:block;width:100%;min-height:240px;resize:vertical;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg);font-size:16px;line-height:1.65;transition:border-color .15s,box-shadow .15s}
textarea.items:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
textarea.items[readonly]{opacity:.6}
.field-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.field-foot p{margin:0;font-size:12px;color:var(--text-2)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.section-head h2{margin:0;font-size:13px;font-weight:600;color:var(--text-2)}

/* history */
.hgroup{margin-top:10px}
.hgroup:first-child{margin-top:0}
.hdate{position:sticky;top:0;padding:8px 0 6px;font-size:12px;font-weight:600;color:var(--text-2);background:var(--surface);z-index:1}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--border)}
.hdate+.hrow{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.hname{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmeta{font-size:12px;color:var(--text-2);white-space:nowrap}
.hrow.fresh{animation:fresh 1.2s var(--ease)}
@keyframes fresh{from{background:var(--accent-soft)}to{background:transparent}}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg)}
.kpi span{display:block;font-size:12px;color:var(--text-2)}
.kpi b{display:block;margin-top:2px;font-size:22px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.highlights{display:grid;gap:8px;margin:10px 0 18px}
.hl{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md)}
.hl-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font-size:15px;flex:none}
.hl div{min-width:0;flex:1}
.hl small{display:block;font-size:12px;color:var(--text-2)}
.hl strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl em{font-style:normal;font-size:12px;color:var(--text-2);white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-top{display:flex;align-items:center;gap:8px;font-size:14px}
.bar-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.bar-name.gone{color:var(--text-3);text-decoration:line-through}
.bar-val{font-size:13px;color:var(--text-2);white-space:nowrap}
.bar-val b{color:var(--text);font-weight:600}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);white-space:nowrap}
.tag.muted{background:var(--surface-2);color:var(--text-2)}
.track{height:8px;margin-top:6px;border-radius:999px;background:var(--track);overflow:hidden}
.fill{height:100%;width:0;border-radius:999px;transition:width .6s var(--ease)}
.bar-sub{margin-top:4px;font-size:12px;color:var(--text-3)}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 16px;color:var(--text-2)}
.empty svg{width:44px;height:44px;color:var(--text-3);margin-bottom:12px}
.empty strong{color:var(--text);font-size:15px;font-weight:600}
.empty p{margin:4px 0 16px;font-size:13px}

/* ---------- sidebar (desktop) ---------- */
.side-head{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 12px 20px}
.side-label{padding:8px 20px 6px;font-size:12px;font-weight:600;color:var(--text-3);display:flex;justify-content:space-between;align-items:center}
.flist{list-style:none;margin:0;padding:0 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.fitem{width:100%;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border:0;border-radius:10px;background:transparent;text-align:left;font-size:14px;font-weight:500;color:var(--text);transition:background .15s}
.fitem:hover{background:var(--surface-2)}
.fitem[aria-current="true"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.fitem .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .fmeta{font-size:12px;color:var(--text-3);font-weight:400}
.fitem[aria-current="true"] .fmeta{color:var(--accent-text);opacity:.75}
.fsq{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.side-foot{padding:12px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:6px}
.side-foot .note{grid-column:1/-1;font-size:11px;color:var(--text-3);padding:2px 4px 0;text-align:center}

/* account */
.acct-btn{width:36px;height:36px;flex:none;padding:0;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text-2);display:grid;place-items:center;box-shadow:var(--shadow-sm);overflow:hidden;transition:background .15s,color .15s}
.acct-btn:hover{background:var(--surface-2);color:var(--text)}
.acct-btn svg{width:18px;height:18px}
.avatar{position:relative;display:inline-grid;place-items:center;width:var(--s,32px);height:var(--s,32px);border-radius:50%;background:var(--accent-soft);color:var(--accent-text);font-weight:700;font-size:calc(var(--s,32px) * .42);overflow:hidden;flex:none}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.acct-side{padding:0 12px 10px}
.acct-card{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--border);background:var(--bg);text-align:left;transition:background .15s,border-color .15s}
.acct-card:hover{background:var(--surface-2);border-color:var(--border-strong)}
.acct-meta{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.acct-meta b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-meta small{font-size:11px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync{width:8px;height:8px;border-radius:50%;background:#22C55E;flex:none;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.sync.saving{background:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.2);animation:blink 1s infinite}
.sync.error{background:var(--danger);box-shadow:0 0 0 3px rgba(220,38,38,.18)}
@keyframes blink{50%{opacity:.35}}
.acct-guest{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--bg)}
.acct-guest b{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.acct-guest small{display:block;font-size:12px;color:var(--text-2);margin-top:2px;line-height:1.45}
.acct-guest .gsi-slot{margin-top:10px}
.gsi-slot{min-height:40px;display:flex;justify-content:center;align-items:center;color-scheme:normal}
.gsi-slot small{color:var(--text-3)}
.pill{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--surface-3);color:var(--text-2)}
.profile{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.profile b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.profile small{display:block;font-size:13px;color:var(--text-2)}
.status-line{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13px;color:var(--text-2)}
.fitem.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.fitem.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.fitem.dragging{opacity:.4}

/* ---------- modal / sheet ---------- */
.layer{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(12,10,9,.4);opacity:0;transition:opacity .22s}
@media (prefers-color-scheme:dark){.scrim{background:rgba(0,0,0,.6)}}
.modal{position:relative;width:100%;max-height:88dvh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);box-shadow:var(--shadow-lg);transform:translateY(100%);transition:transform .32s var(--ease)}
.layer.open .scrim{opacity:1}
.layer.open .modal{transform:none}
.grabber{width:36px;height:5px;border-radius:999px;background:var(--border-strong);margin:0 auto 14px}
.m-title{margin:4px 0 6px;font-size:18px;font-weight:700;letter-spacing:-.02em}
.m-desc{margin:0 0 18px;color:var(--text-2);font-size:14px}
.m-actions{display:flex;gap:8px;margin-top:18px}
.m-actions .btn{flex:1;height:44px;font-size:15px}
.input{width:100%;height:46px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg);font-size:16px}
.input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (min-width:640px){
  .layer{align-items:center;padding:24px}
  .modal{width:400px;border-radius:var(--r-xl);padding:22px 24px 24px;transform:scale(.94);opacity:0;transition:transform .3s var(--spring),opacity .2s}
  .layer.open .modal{transform:none;opacity:1}
  .grabber{display:none}
}
.layer.closing .modal{transition-duration:.18s}

/* winner */
.winner{text-align:center;padding-top:6px}
.winner .eyebrow{font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:.02em}
.winner .orb{width:64px;height:64px;margin:16px auto 14px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 8px color-mix(in srgb,var(--glow) 18%,transparent),0 12px 40px -6px var(--glow);display:grid;place-items:center;font-size:28px;animation:pop .6s var(--spring) both .05s}
.winner .wname{font-size:30px;font-weight:750;letter-spacing:-.035em;line-height:1.2;word-break:keep-all;overflow-wrap:anywhere;animation:rise .5s var(--ease) both .12s}

<script>
'use strict';
(() => {
const LS_KEY = 'roulette.v2';
const TZ = 'Asia/Seoul';
const TAU = Math.PI * 2;
const MAX_ITEMS = 50, MAX_HISTORY = 3000;
const PALETTE = {
  light: ['#4F46E5','#E8B85C','#0F8B8D','#D4637E','#8E9BF5','#7A52B3','#7DBDA3','#E2875F','#3E7CB1','#C7B8E8'],
  dark:  ['#6366F1','#D9AE5F','#2A9D8F','#C8647D','#8B95E8','#8B67C2','#6FAE96','#D2805C','#4A86BD','#B3A6D9']
};
const $ = s => document.querySelector(s);
const mqDark = matchMedia('(prefers-color-scheme: dark)');
const mqReduce = matchMedia('(prefers-reduced-motion: reduce)');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mod = (a, n) => ((a % n) + n) % n;

/* ---------- randomness (crypto, unbiased) ---------- */
function rnd() { const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] / 4294967296; }
function randInt(n) {
  const lim = Math.floor(4294967296 / n) * n, u = new Uint32Array(1);

}
function uid() { const a = new Uint32Array(2); crypto.getRandomValues(a); return a[0].toString(36) + a[1].toString(36); }
const parseItems = s => String(s).split(/[\n,]/).map(x => x.trim().slice(0, 100)).filter(Boolean).slice(0, MAX_ITEMS);

/* ---------- colors ---------- */
const pal = () => PALETTE[mqDark.matches ? 'dark' : 'light'];
function colorFor(i, n) {

function colorOfName(f, name) { const i = f.items.indexOf(name); return i >= 0 ? colorFor(i, f.items.length) : '#A8A29E'; }

/* ---------- time (Asia/Seoul) ---------- */
const fTime = new Intl.DateTimeFormat('ko-KR', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
const fDate = new Intl.DateTimeFormat('ko-KR', { timeZone: TZ, month: 'long', day: 'numeric', weekday: 'short' });
const fDateY = new Intl.DateTimeFormat('ko-KR', { timeZone: TZ, year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
const fShort = new Intl.DateTimeFormat('ko-KR', { timeZone: TZ, month: 'numeric', day: 'numeric' });
const seoulDay = t => Math.floor((t + 9 * 3600000) / 86400000);
const yearOf = t => new Date(t + 9 * 3600000).getUTCFullYear();
function dayLabel(t) {
  const d = seoulDay(Date.now()) - seoulDay(t);
  if (d === 0) return '오늘'; if (d === 1) return '어제';
  return (yearOf(t) === yearOf(Date.now()) ? fDate : fDateY).format(t);
}
function ago(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return '방금';
  if (s < 3600) return Math.floor(s / 60) + '분 전';
  const d = seoulDay(Date.now()) - seoulDay(t);
  if (d === 0) return Math.floor(s / 3600) + '시간 전';
  if (d === 1) return '어제';
  return d + '일 전';
}
const fullStamp = t => (yearOf(t) === yearOf(Date.now()) ? fDate : fDateY).format(t) + ' ' + fTime.format(t);

/* ---------- state ---------- */
function newFolder(name, items = []) { return { id: uid(), name, items, exclude: false, history: [], created: Date.now() }; }
function defaultState() {
  const a = newFolder('점심', ['김치찌개','된장찌개','제육볶음','돈까스','쌀국수','샐러드']);
  const b = newFolder('산책', ['한강','동네 공원','뒷산','카페 거리']);
  return { v: 2, active: a.id, folders: [a, b] };
}
function normFolder(f) {
  if (!f || typeof f !== 'object') return null;
  const items = (Array.isArray(f.items) ? f.items : parseItems(f.items || '')).map(x => String(x).trim().slice(0, 100)).filter(Boolean).slice(0, MAX_ITEMS);
  const history = (Array.isArray(f.history) ? f.history : [])
    .filter(e => e && typeof e.t === 'number' && isFinite(e.t) && typeof e.w === 'string')
    .map(e => ({ t: e.t, w: e.w.slice(0, 200), n: typeof e.n === 'number' ? e.n : 0 }))
    .sort((x, y) => x.t - y.t).slice(-MAX_HISTORY);
  return { id: typeof f.id === 'string' && f.id ? f.id : uid(), name: String(f.name || '이름 없는 룰렛').slice(0, 40), items, exclude: !!f.exclude, history, created: typeof f.created === 'number' ? f.created : Date.now() };
}
function normState(s) {
  const folders = (s && Array.isArray(s.folders) ? s.folders : []).map(normFolder).filter(Boolean);
  if (!folders.length) return null;
  const active = folders.some(f => f.id === s.active) ? s.active : folders[0].id;
  return { v: 2, active, folders };
}
function load() {
  try { const s = normState(JSON.parse(localStorage.getItem(LS_KEY))); if (s) return s; } catch (e) {}
  return defaultState();
}
let state = load();
let mode = 'guest';            // 'guest' (localStorage) | 'cloud' (server account)
let account = null, apiAvailable = false, loginEnabled = false, clientId = null, gisReady = false, gisFailed = false, syncError = false;
const MODE_KEY = 'roulette.mode', CLOUD_CACHE = 'roulette.cloudCache';
function save() {
  try {
    if (mode === 'cloud') localStorage.setItem(CLOUD_CACHE, JSON.stringify({ user: account, state }));
    else localStorage.setItem(LS_KEY, JSON.stringify(state));
  } catch (e) { if (mode !== 'cloud') toast('저장하지 못했어요 (저장 공간 확인)'); }
}
const cur = () => state.folders.find(f => f.id === state.active) || state.folders[0];

/* ---------- elements ---------- */
const cv = $('#wheel'), box = $('#wheelBox'), hub = $('#hub'), pointer = $('#pointer'), ta = $('#items');
let rot = 0, spinning = false, highlight = -1, activeTab = 'items';

/* ---------- wheel ---------- */
function setRot() { cv.style.transform = 'rotate(' + rot + 'rad)'; }
const indexAt = (r, n) => Math.floor(mod(-r, TAU) / (TAU / n)) % n;
function fitLabel(x, text, maxW) {
  if (x.measureText(text).width <= maxW) return text;
  let s = text;
  while (s.length > 1 && x.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
}
function drawWheel() {
  const size = cv.clientWidth || 320, dpr = Math.min(3, window.devicePixelRatio || 1);
  const px = Math.round(size * dpr);
  if (cv.width !== px) { cv.width = px; cv.height = px; }
  const x = cv.getContext('2d');
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, size, size);
  const f = cur(), it = f.items, n = it.length, c = size / 2, R = c;
  const cs = getComputedStyle(document.documentElement);
  const bg = cs.getPropertyValue('--surface').trim() || '#fff';
  if (!n) {
    x.fillStyle = cs.getPropertyValue('--surface-2').trim(); x.beginPath(); x.arc(c, c, R, 0, TAU); x.fill();
    x.setLineDash([6, 8]); x.strokeStyle = cs.getPropertyValue('--border-strong').trim(); x.lineWidth = 1.5;
    x.beginPath(); x.arc(c, c, R * .78, 0, TAU); x.stroke(); x.setLineDash([]);
    return;
  }
  const a = TAU / n;
  for (let i = 0; i < n; i++) {
    const s = i * a - Math.PI / 2, col = colorFor(i, n);
    x.beginPath(); x.moveTo(c, c); x.arc(c, c, R, s, s + a); x.closePath();
    x.fillStyle = col; x.fill();
    if (highlight >= 0 && i !== highlight) { x.fillStyle = mqDark.matches ? 'rgba(12,10,9,.62)' : 'rgba(255,255,255,.62)'; x.fill(); }
  }
  if (n > 1) {
    x.strokeStyle = bg; x.lineWidth = 2; x.lineCap = 'round';
    for (let i = 0; i < n; i++) { const s = i * a - Math.PI / 2; x.beginPath(); x.moveTo(c, c); x.lineTo(c + R * Math.cos(s), c + R * Math.sin(s)); x.stroke(); }
  }
  // subtle inner vignette for depth
  const g = x.createRadialGradient(c, c, R * .2, c, c, R);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.85, 'rgba(255,255,255,0)'); g.addColorStop(1, mqDark.matches ? 'rgba(0,0,0,.18)' : 'rgba(0,0,0,.06)');
  x.fillStyle = g; x.beginPath(); x.arc(c, c, R, 0, TAU); x.fill();
  // labels
  const fs = Math.max(11, Math.min(17, size / 26, (a * R * .55) * .62));
  x.font = '600 ' + fs + 'px ' + cs.getPropertyValue('--font');
  x.textAlign = 'right'; x.textBaseline = 'middle';
  const hubR = Math.min(46, size * .1) + 8, maxW = R - 16 - hubR;
  for (let i = 0; i < n; i++) {
    const mid = i * a - Math.PI / 2 + a / 2, col = colorFor(i, n);
    const flip = Math.cos(mid + rot) < -0.02; // keep labels upright at rest (left half of the screen)
    x.save(); x.translate(c, c); x.rotate(flip ? mid + Math.PI : mid);
    x.globalAlpha = highlight >= 0 && i !== highlight ? .45 : 1;
    x.fillStyle = labelColor(col);
    x.textAlign = flip ? 'left' : 'right';
    x.fillText(fitLabel(x, it[i], maxW), flip ? -(R - 16) : R - 16, 0.5);
    x.restore();
  }
}

/* ---------- spin ---------- */
function tick() {
  if (mqReduce.matches || !pointer.animate) return;
  pointer.animate([{ transform: 'rotate(-16deg)' }, { transform: 'rotate(0deg)' }], { duration: 140, easing: 'cubic-bezier(.2,.8,.2,1)' });
}
function spin() {
  if (spinning) return;
  const f = cur();
  commitItems(); cloud.flush();
  const it = f.items.slice(), n = it.length;
  if (n < 2) { toast('항목을 2개 이상 추가하면 돌릴 수 있어요'); selectTab('items'); ta.focus(); return; }
  spinning = true; document.body.classList.add('spinning'); hub.disabled = true; ta.readOnly = true;
  highlight = -1; box.classList.remove('glow'); drawWheel();
  const a = TAU / n, win = randInt(n);
  const off = (rnd() - .5) * a * .8;               // stay well inside the slice
  const target = mod(-(win * a + a / 2 + off), TAU); // rotation that puts the slice under the top pointer
  const start = rot, reduce = mqReduce.matches;
  const delta = mod(target - mod(start, TAU), TAU) + TAU * (reduce ? 1 : 5 + randInt(3));
  const dur = reduce ? 1100 : 3600 + rnd() * 1200;
  const t0 = performance.now(); let last = indexAt(start, n);
  const frame = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
    rot = start + delta * e; setRot();
    const k = indexAt(rot, n); if (k !== last) { last = k; tick(); }
    if (p < 1) requestAnimationFrame(frame); else finish();
  };
  const finish = () => {
    rot = mod(rot, TAU); setRot();
    const landed = indexAt(rot, n);       // what the pointer visually shows
    if (landed !== win) console.warn('pointer mismatch', landed, win);
    const name = it[landed], t = Date.now();
    const entry = { t, w: name, n };
    f.history.push(entry); if (f.history.length > MAX_HISTORY) f.history.splice(0, f.history.length - MAX_HISTORY);
    save(); cloud.spin(f, entry);
    highlight = landed; drawWheel();
    box.style.setProperty('--glow', colorFor(landed, n)); box.classList.add('glow');
    renderFolders(); renderStageMeta(); renderHistory(true); renderStats(); renderLast();
    setTimeout(() => showWinner(f, name, landed, n, t), reduce ? 60 : 380);
  };
  requestAnimationFrame(frame);
}
function endSpin(f, idx, name) {
  highlight = -1; box.classList.remove('glow');
  if (f.exclude && f.items[idx] === name) {
    f.items.splice(idx, 1); save(); cloud.patch(f, { items: f.items });
    if (f.id === state.active) ta.value = f.items.join('\n');
    toast('‘' + name + '’ 항목을 뺐어요');
  }
  spinning = false; document.body.classList.remove('spinning'); hub.disabled = false; ta.readOnly = false;
  renderAll(false);
}
function showWinner(f, name, idx, n, t) {

/* ---------- confetti ---------- */
function confetti() {
  if (mqReduce.matches) return;
  const c = $('#confetti'), x = c.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  const W = innerWidth, H = innerHeight; c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = pal(), ps = [];
  const ox = W / 2, oy = W < 640 ? H * .55 : H * .4;
  for (let i = 0; i < 110; i++) {
    const ang = -Math.PI / 2 + (rnd() - .5) * 1.9, sp = 7 + rnd() * 9;
    ps.push({ x: ox + (rnd() - .5) * 60, y: oy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, w: 5 + rnd() * 5, h: 8 + rnd() * 6, r: rnd() * TAU, vr: (rnd() - .5) * .35, c: cols[i % cols.length], o: 1 });
  }
  const t0 = performance.now();
  const step = now => {
    const el = now - t0; x.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.vx *= .985; p.vy = p.vy * .985 + .32; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      p.o = Math.max(0, 1 - Math.max(0, el - 1200) / 800);
      x.save(); x.globalAlpha = p.o; x.translate(p.x, p.y); x.rotate(p.r); x.scale(1, Math.cos(p.r * 2));
      x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore();
    }
    if (el < 2000) requestAnimationFrame(step); else x.clearRect(0, 0, W, H);
  };
  requestAnimationFrame(step);
}

function openModal(html, { label = '', onClose, dismissable = true } = {}) {
  const layer = document.createElement('div');
  layer.className = 'layer';
  layer.innerHTML = '<div class="scrim"></div><div class="modal" role="dialog" aria-modal="true"' + (label ? ' aria-label="' + esc(label) + '"' : '') + '>' + html + '</div>';
  document.body.appendChild(layer);
  const prev = document.activeElement, modal = layer.querySelector('.modal');
  requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add('open')));
  let closed = false;
  const onKey = e => {
    if (e.key === 'Escape' && dismissable) { e.preventDefault(); close(); }
    if (e.key === 'Tab') {
      const f = [...modal.querySelectorAll('button,input,textarea,[tabindex]:not([tabindex="-1"])')].filter(el => !el.disabled);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }

  function close(v) {
    if (closed) return; closed = true;
    layer.classList.remove('open'); layer.classList.add('closing');
    document.removeEventListener('keydown', onKey);
    setTimeout(() => layer.remove(), mqReduce.matches ? 0 : 260);
    if (prev && prev.focus && document.contains(prev)) prev.focus({ preventScroll: true });
    onClose && onClose(v);
  }
  layer.querySelector('.scrim').onclick = () => dismissable && close();
  document.addEventListener('keydown', onKey);
  return { el: modal, close };
}

function computeStats(f) {
  const map = new Map();
  f.items.forEach((name, i) => { if (!map.has(name)) map.set(name, { name, count: 0, last: 0, inList: true, order: i }); });
  for (const e of f.history) {
    let s = map.get(e.w);
    if (!s) { s = { name: e.w, count: 0, last: 0, inList: false, order: 999 }; map.set(e.w, s); }
    s.count++; if (e.t > s.last) s.last = e.t;

  const rows = [...map.values()].sort((a, b) => b.count - a.count || (b.inList - a.inList) || a.order - b.order);
  const total = f.history.length, today = seoulDay(Date.now());
  const todayCount = f.history.filter(e => seoulDay(e.t) === today).length;
  const listed = rows.filter(r => r.inList);
  const max = rows.length ? rows[0].count : 0;
  const most = rows.filter(r => r.count === max && max > 0);
  const minC = listed.length ? Math.min(...listed.map(r => r.count)) : 0;
  const least = listed.filter(r => r.count === minC);
  let streak = 0, streakName = null;
  for (let i = f.history.length - 1; i >= 0; i--) { if (streakName === null) streakName = f.history[i].w; if (f.history[i].w === streakName) streak++; else break; }

}

/* ---------- server API & sync ---------- */
async function api(method, path, body, keepalive) {
  const o = { method, credentials: 'same-origin', headers: { 'X-Requested-With': 'roulette' }, keepalive: !!keepalive };
  if (body !== undefined) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
  const r = await fetch(path, o);
  const ct = r.headers.get('content-type') || '';
  const data = ct.indexOf('application/json') >= 0 ? await r.json().catch(() => null) : null;
  if (!r.ok || !data) { const e = new Error((data && data.error) || 'http_' + r.status); e.status = data ? r.status : (r.ok ? 0 : r.status); e.code = data && data.error; throw e; }
  return data;
}
const cloud = {
  q: Promise.resolve(), pending: 0, timers: {},
  run(fn) {
    if (mode !== 'cloud') return;
    this.pending++; setSync();
    this.q = this.q.then(fn).catch(onSyncError).then(() => { this.pending--; setSync(); });
  },
  create(f) { const b = { id: f.id, name: f.name, items: f.items.slice(), exclude: f.exclude }; this.run(() => api('POST', '/api/folders', b)); },
  patch(f, body) { const id = f.id, b = JSON.parse(JSON.stringify(body)); this.run(() => api('PATCH', '/api/folders/' + id, b)); },
  del(id) { clearTimeout(this.timers[id]); delete this.timers[id]; this.run(() => api('DELETE', '/api/folders/' + id)); },
  order() { const ids = state.folders.map(f => f.id); this.run(() => api('PUT', '/api/folders/order', { ids })); },
  clear(f) { const id = f.id; this.run(() => api('DELETE', '/api/folders/' + id + '/spins')); },
  spin(f, e) { const id = f.id; this.run(async () => { const r = await api('POST', '/api/folders/' + id + '/spins', { item: e.w, n: e.n }); e.t = r.spin.t; save(); }); },
  items(f) {
    if (mode !== 'cloud') return;
    clearTimeout(this.timers[f.id]);
    this.timers[f.id] = setTimeout(() => { delete this.timers[f.id]; this.patch(f, { items: f.items }); }, 500);
  },
  flush(keepalive) {
    for (const id of Object.keys(this.timers)) {
      clearTimeout(this.timers[id]); delete this.timers[id];
      const f = state.folders.find(x => x.id === id); if (!f) continue;
      if (keepalive) api('PATCH', '/api/folders/' + id, { items: f.items }, true).catch(() => {});
      else this.patch(f, { items: f.items });
    }
  },
  reset() { for (const id of Object.keys(this.timers)) clearTimeout(this.timers[id]); this.timers = {}; }
};
function onSyncError(e) {

  syncError = true; setSync();
  toast(e && e.status ? '저장하지 못했어요 · 서버 데이터로 다시 맞출게요' : '오프라인이에요 · 연결되면 다시 맞출게요');
  setTimeout(() => refreshFromServer(true), 1500);
}
function setSync() {
  const st = syncError ? 'error' : cloud.pending ? 'saving' : 'ok';
  const label = { ok: '동기화됨', saving: '저장 중…', error: '동기화 오류' }[st];
  document.querySelectorAll('.sync').forEach(d => { d.className = 'sync ' + st; d.title = label; });
  document.querySelectorAll('[data-sync-label]').forEach(d => d.textContent = label);
}

    } catch (e) {
      if (e.status === 401 && mode === 'cloud') { becomeGuest(); toast('로그인이 만료됐어요'); }
      else if (mode === 'cloud') toast('서버에 연결할 수 없어요 · 마지막으로 저장된 사본이에요');
    }
    if (loginEnabled) loadGIS();
  } else if (mode === 'cloud') {
    toast('서버에 연결할 수 없어요 · 마지막으로 저장된 사본이에요');
  }
  renderAccount();
  handleHash();
}
boot();
window.__roulette = { indexAt, state: () => state, mode: () => mode };
})();
</script>
</body>
</html>
